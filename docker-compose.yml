services:
  db:
    image: postgres:16-alpine
    container_name: painel-atualizacoes-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: aspan
      POSTGRES_PASSWORD: aspan
      POSTGRES_DB: aspan
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aspan -d aspan']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
